<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearLens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>ClearLens</h1>
      <span class="subtitle" id="auth-status"></span>
    </header>

    <nav>
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="history">History</button>
      <button class="tab" data-tab="account">Account</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>

    <main>
      <section id="dashboard" class="tab-content active">
        <p class="tip">Watch a YouTube Short and click the <strong>Verify</strong> button to check it.</p>
        <div id="stats">
          <div class="stat">
            <span class="stat-value" id="total-checked">0</span>
            <span class="stat-label">Checked</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="today-checked">0</span>
            <span class="stat-label">Today</span>
          </div>
        </div>
      </section>

      <section id="history" class="tab-content">
        <div id="history-list">
          <p class="empty">No videos checked yet.</p>
        </div>
      </section>

      <section id="account" class="tab-content">
        <div id="login-form">
          <h3>Login</h3>
          <input type="email" id="login-email" placeholder="Email">
          <input type="password" id="login-password" placeholder="Password">
          <button id="login-btn" class="btn-primary">Login</button>
          <p class="switch-form">No account? <a href="#" id="show-register">Register</a></p>
        </div>
        <div id="register-form" style="display:none;">
          <h3>Register</h3>
          <input type="text" id="reg-name" placeholder="Name (optional)">
          <input type="email" id="reg-email" placeholder="Email">
          <input type="password" id="reg-password" placeholder="Password (min 6 chars)">
          <button id="register-btn" class="btn-primary">Register</button>
          <p class="switch-form">Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>
        <div id="profile" style="display:none;">
          <p id="profile-email"></p>
          <button id="logout-btn" class="btn-secondary">Logout</button>
        </div>
        <div id="auth-error" class="error-msg" style="display:none;"></div>
      </section>

      <section id="settings" class="tab-content">
        <h3>Settings</h3>
        <label>API Base URL</label>
        <input type="url" id="api-url" placeholder="http://localhost:8000">
        <p class="help-text">Where the ClearLens API is running.</p>
        <button id="save-settings" class="btn-primary">Save</button>
        <div id="settings-msg" class="success-msg" style="display:none;"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
